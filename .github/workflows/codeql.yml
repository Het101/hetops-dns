name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed pattern is found without waiting for a commit.
    - cron: "17 4 * * 1"

# Read-only floor. The one job that needs to write does so below, scoped to
# itself, so a step added later cannot quietly inherit write.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # First step on purpose, so it sees every step after it. Audit mode
      # records outbound destinations without blocking, which is what an
      # allowlist for block mode has to be built from.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # server.js fetches user-supplied hostnames, parses DMARC XML from
      # strangers and renders the results into HTML: SSRF, injection and XSS
      # are the bug classes that matter here, and the security-and-quality pack
      # is what looks for them.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
